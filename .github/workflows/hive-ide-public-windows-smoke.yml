name: Hive IDE public Windows smoke — HOLD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hive-ide-public-windows-smoke-hold
  cancel-in-progress: true

jobs:
  evidence-expired-hold:
    name: No installer action — evidence expired
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the held evidence contract
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Validate the expired evidence and effective HOLD
        shell: bash
        run: |
          set -euo pipefail
          node script/check-ide-release.mjs --self-test
          echo "EVIDENCE_EXPIRED_HELD: zero installer bytes fetched, executed, installed, launched, or tested."
