name: Publish reviewed Pages artifact

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      requested_sha:
        description: Exact landed-main commit that created this publication signal
        required: true
        type: string
      signal_kind:
        description: Auditable publication signal kind
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Only genuine publication work enters this lock. A no-change or failed sync
  # never calls this workflow and therefore cannot cancel or displace a deploy.
  deploy-reviewed-pages:
    if: github.repository == 'Dhenz14/Dhenz14.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: reviewed-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current Pages main under the deployment lock
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve current main and validate the signal lower-bound
        id: bind
        env:
          REQUESTED_SHA: ${{ inputs.requested_sha || github.sha }}
          SIGNAL_KIND: ${{ inputs.signal_kind || github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SIGNAL_KIND" =~ ^[a-z0-9_-]+$ ]]
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          target_sha="$(git rev-parse refs/remotes/origin/main)"
          test "$(git rev-parse HEAD)" = "$target_sha"
          git cat-file -e "$REQUESTED_SHA^{commit}"
          git merge-base --is-ancestor "$REQUESTED_SHA" "$target_sha"
          echo "requested_sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "signal_kind=$SIGNAL_KIND" >> "$GITHUB_OUTPUT"
          echo "Publication signal $SIGNAL_KIND requested=$REQUESTED_SHA current_main=$target_sha"

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Verify source, hostile contracts, and publication policy
        shell: bash
        run: |
          set -euo pipefail
          for source in hub-assets/*.js hub-assets/*.mjs script/*.mjs; do node --check "$source"; done
          node script/hub-facts-custody.mjs --self-test
          node script/private-source-bundle.mjs --self-test
          node script/check-central-hub.mjs
          node script/check-product-truth.mjs --self-test
          node script/check-ide-release.mjs --self-test
          node script/check-browser-json-acquisition.mjs
          node script/check-galaxy-bridge.mjs
          node script/check-galaxy-core.mjs
          node script/check-publisher-races.mjs
          node script/check-signed-release.mjs
          node script/check-signed-release.mjs --verify-git-provenance
          node script/check-signed-release.mjs --self-test
          node script/check-signed-release-portability.mjs --git-archive
          node script/build-public-pages.mjs --self-test
          git diff --check

      - name: Build and exercise a brand-new exact-membership Pages stage
        shell: bash
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/hive-pages-reviewed"
          test ! -e "$stage"
          node script/build-public-pages.mjs build --output "$stage"
          node script/build-public-pages.mjs check --output "$stage"
          node script/check-http-surface.mjs --root "$stage"

      - name: Refuse a stale main artifact immediately before upload
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
          test "$(git rev-parse HEAD)" = "${{ steps.bind.outputs.target_sha }}"

      - name: Configure GitHub Actions Pages deployment
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload only the reviewed Pages stage
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/hive-pages-reviewed

      - name: Deploy the reviewed artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Verify the deployed target through the bounded HTTP parity gate
        env:
          DEPLOYED_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          node script/check-live-parity.mjs \
            --origin "$DEPLOYED_BASE_URL" \
            --expected-root . \
            --expected-target-sha "${{ steps.bind.outputs.target_sha }}"
