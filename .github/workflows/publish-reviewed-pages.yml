name: Publish reviewed Pages artifact

on:
  push:
    branches: [main]
  workflow_dispatch:
  # GITHUB_TOKEN pushes do not emit a second push workflow. The completed sync
  # event therefore provides the no-PAT path from an admitted facts update to
  # this exact allowlisted deployment.
  workflow_run:
    workflows: ["Sync living galaxy"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reviewed-pages
  cancel-in-progress: true

jobs:
  resolve-publication:
    if: >-
      (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.resolve.outputs.should_publish }}
      target-sha: ${{ steps.resolve.outputs.target_sha }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out current main with exact history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve an exact changed publication target
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            base_sha="${{ github.event.workflow_run.head_sha }}"
            if [[ "$target_sha" == "$base_sha" ]]; then
              echo "Scheduled sync made no source change; Pages redeploy is intentionally skipped."
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            test "$(git rev-parse HEAD^)" = "$base_sha"
            test "$(git diff --name-only "$base_sha"..HEAD)" = "hub-assets/hub-facts.json"
            git show -s --format=%s HEAD | grep -Eq '^chore\(galaxy\): (absorb Hive-AI [a-f0-9]{12}|mark private source bridge inactive)$'
          else
            test "$GITHUB_REF" = "refs/heads/main"
            test "$target_sha" = "$GITHUB_SHA"
          fi
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "Reviewed publication target: $target_sha"

  build:
    needs: resolve-publication
    if: needs.resolve-publication.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the exact resolved public-source commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve-publication.outputs.target-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind checkout to the exact resolved main commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.resolve-publication.outputs.target-sha }}"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Verify publication code and contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check hub-assets/hub.js
          node --check hub-assets/galaxy-core.mjs
          node --check hub-assets/ide-release-core.mjs
          node --check hub-assets/strict-json.mjs
          node --check hub-assets/strict-json-fetch.mjs
          node --check script/check-browser-json-acquisition.mjs
          node --check script/build-public-pages.mjs
          node --check script/check-http-surface.mjs
          node --check script/check-public-pages-artifact.mjs
          node --check script/hub-facts-custody.mjs
          node script/hub-facts-custody.mjs --self-test
          node script/check-central-hub.mjs
          node script/check-product-truth.mjs --self-test
          node script/check-ide-release.mjs --self-test
          node script/check-browser-json-acquisition.mjs
          node script/check-galaxy-bridge.mjs
          node script/check-galaxy-core.mjs
          node script/check-publisher-races.mjs
          node script/check-signed-release.mjs
          node script/check-signed-release.mjs --verify-git-provenance
          node script/check-signed-release.mjs --self-test
          node script/check-signed-release-portability.mjs --git-archive
          node script/build-public-pages.mjs --self-test
          git diff --check

      - name: Build a brand-new exact-membership Pages stage
        shell: bash
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/hive-pages-reviewed"
          test ! -e "$stage"
          node script/build-public-pages.mjs build --output "$stage"
          node script/build-public-pages.mjs check --output "$stage"
          node script/check-http-surface.mjs --root "$stage"

      - name: Refuse a stale main artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"

      - name: Configure GitHub Actions Pages deployment
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload only the reviewed Pages stage
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/hive-pages-reviewed

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the reviewed artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
