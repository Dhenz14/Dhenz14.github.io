name: Sync living galaxy

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: living-galaxy-main-publisher
  cancel-in-progress: false

jobs:
  materialize-private-source:
    if: github.repository == 'Dhenz14/Dhenz14.github.io' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.LIVING_GALAXY_CLOUD_SYNC_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      source_ready: ${{ steps.classify.outputs.source_ready }}
      inactive_reason: ${{ steps.classify.outputs.inactive_reason }}
    steps:
      - name: Check out the exact trusted Pages compiler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: site
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Check private-source credential availability without exporting it
        id: source-auth
        env:
          HIVE_AI_READ_DEPLOY_KEY: ${{ secrets.HIVE_AI_READ_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${HIVE_AI_READ_DEPLOY_KEY:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize the exact private main checkout without persistent credentials
        id: source-checkout
        if: steps.source-auth.outputs.configured == 'true'
        continue-on-error: true
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Dhenz14/Hive-AI
          ref: main
          path: hive-ai
          ssh-key: ${{ secrets.HIVE_AI_READ_DEPLOY_KEY }}
          ssh-strict: true
          fetch-depth: 128
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /hiveai/__init__.py
            /hiveai/_optional_scripts.py
            /hiveai/living_anatomy/
            /hiveai/static/living-anatomy/src/galaxy-contract.json
            /hiveai/moons/universal_manifest.py
            /hiveai/neuron_swarm/
            /hiveai/one_turn/
            /hiveai/orbs/
            /hiveai/physiology/
            /configs/hivebrain/
            /configs/federation_manifest.json
            /data/neuron_swarm/portable_green_evidence_membership_20260722.json
            /docs/soak_receipts/neuron_swarm/
            /docs/soak_receipts/*.json
            /docs/soak_receipts/*.jsonl
            /docs/FORMAL_CORTEX_LEDGER_V1.json
            /docs/c14_moon_lattice/
            /docs/HIVE_INTEGRITY_DEPENDENCY_GRAPH.json
            /docs/handoffs/
            /docs/UNIFIED_CAPABILITY_REGISTRY.json
            /docs/soak_receipts/proof_carrying_memory_fabric_20260727/
            /docs/soak_receipts/physiology/
            /docs/generated/proof_carrying_memory_galaxy.mmd
            /scripts/build_living_anatomy.py
            /scripts/audit_served_influence_reachability.py
            /scripts/build_neuron_dossiers.py
            /scripts/materialize_full_neuron_swarm.py
            /schemas/living_anatomy_*.schema.json
            /tests/fixtures/physiology/formal_l3_e01_v2/RATIFY_L3_E01_V2.json
            /tests/fixtures/physiology/formal_l3_e02/window_seal/RATIFY_L3_E02_V1.json

      - name: Build a byte-bound inert source materialization
        if: steps.source-auth.outputs.configured == 'true' && steps.source-checkout.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C hive-ai config --local --get core.sshCommand || true)"
          node site/script/private-source-bundle.mjs create --source hive-ai --output materialized

      - name: Emit a credential-missing inactive materialization
        if: steps.source-auth.outputs.configured != 'true'
        shell: bash
        run: node site/script/private-source-bundle.mjs inactive --output materialized --reason CREDENTIAL_NOT_CONFIGURED

      - name: Emit a checkout-failed inactive materialization
        if: steps.source-auth.outputs.configured == 'true' && steps.source-checkout.outcome != 'success'
        shell: bash
        run: node site/script/private-source-bundle.mjs inactive --output materialized --reason CHECKOUT_FAILED

      - name: Verify and classify the bounded materialization
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          node site/script/private-source-bundle.mjs verify --bundle materialized
          status="$(node site/script/private-source-bundle.mjs field --bundle materialized --name status)"
          if [[ "$status" == "SOURCE_MATERIALIZED" ]]; then
            echo "source_ready=true" >> "$GITHUB_OUTPUT"
            echo "inactive_reason=" >> "$GITHUB_OUTPUT"
          else
            echo "source_ready=false" >> "$GITHUB_OUTPUT"
            echo "inactive_reason=$(node site/script/private-source-bundle.mjs field --bundle materialized --name reason)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload only the inert bound source materialization
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: private-source-materialization
          path: materialized
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          compression-level: 0

  compile:
    needs: materialize-private-source
    if: needs.materialize-private-source.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.site-base.outputs.base_sha }}
    steps:
      - name: Check out the same trusted Pages compiler without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: site
          fetch-depth: 0
          persist-credentials: false

      - name: Bind the exact compiler base
        id: site-base
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download the inert private-source materialization
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: private-source-materialization
          path: materialized

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Prove the compiler job has no private checkout credential
        shell: bash
        run: |
          set -euo pipefail
          test -z "${HIVE_AI_READ_DEPLOY_KEY:-}"
          test -z "${GIT_SSH_COMMAND:-}"
          test -z "$(git config --global --get core.sshCommand || true)"
          test -z "$(find materialized -type d -name .git -print -quit)"
          node site/script/private-source-bundle.mjs verify --bundle materialized

      - name: Use Python 3.12 for a verified materialized source
        if: needs.materialize-private-source.outputs.source_ready == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/script/requirements-galaxy-sync.txt

      - name: Install the hash-locked compiler dependency
        if: needs.materialize-private-source.outputs.source_ready == 'true'
        shell: bash
        run: "python -m pip install --require-hashes --only-binary=:all: -r site/script/requirements-galaxy-sync.txt"

      - name: Prepare an ephemeral credential-free compiler checkout
        if: needs.materialize-private-source.outputs.source_ready == 'true'
        shell: bash
        run: node site/script/private-source-bundle.mjs prepare --bundle materialized

      - name: Compile one bound private-main source observation
        if: needs.materialize-private-source.outputs.source_ready == 'true'
        env:
          GALAXY_AUTOMATIC_BRIDGE_CONFIGURED_AT_CAPTURE: ${{ vars.LIVING_GALAXY_CLOUD_SYNC_ENABLED == 'true' && 'true' || 'false' }}
          GALAXY_SOURCE_ACQUISITION_MODE_AT_CAPTURE: cloud
          GALAXY_BRIDGE_INACTIVE_REASON: MANUAL_WORKFLOW_DISPATCH
        shell: bash
        run: node site/script/sync-galaxy-snapshot.mjs --source-bundle materialized

      - name: Retain last-good topology behind a credential-missing HOLD
        if: needs.materialize-private-source.outputs.source_ready != 'true' && needs.materialize-private-source.outputs.inactive_reason == 'CREDENTIAL_NOT_CONFIGURED'
        shell: bash
        run: node site/script/mark-galaxy-bridge-inactive.mjs --credential-missing

      - name: Retain last-good topology behind a checkout-failed HOLD
        if: needs.materialize-private-source.outputs.source_ready != 'true' && needs.materialize-private-source.outputs.inactive_reason == 'CHECKOUT_FAILED'
        shell: bash
        run: node site/script/mark-galaxy-bridge-inactive.mjs --checkout-failed

      - name: Refuse unexpected compiler changes
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | sed -E 's/^...//' | sort -u)"
          if [[ -z "$changed" ]]; then
            echo "Snapshot already represents this bounded observation."
          elif [[ "$changed" != "hub-assets/hub-facts.json" ]]; then
            printf 'Unexpected generated paths:\n%s\n' "$changed" >&2
            exit 1
          fi

      - name: Verify the credential-free candidate
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          for source in hub-assets/*.js hub-assets/*.mjs script/*.mjs; do node --check "$source"; done
          node script/hub-facts-custody.mjs --self-test
          node script/private-source-bundle.mjs --self-test
          node script/check-central-hub.mjs
          node script/check-galaxy-bridge.mjs
          node script/check-galaxy-core.mjs
          node script/check-browser-json-acquisition.mjs
          node script/check-public-pages-artifact.mjs
          node script/check-publisher-races.mjs
          node script/check-signed-release.mjs
          node script/check-signed-release.mjs --verify-git-provenance
          node script/check-signed-release.mjs --self-test
          node script/check-signed-release-portability.mjs --git-archive
          git diff --check

      - name: Upload only the inert snapshot candidate
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: living-galaxy-candidate
          path: site/hub-assets/hub-facts.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: compile
    if: needs.compile.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      target_sha: ${{ steps.publish.outputs.target_sha }}
    steps:
      - name: Check out current Pages main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          path: site
          fetch-depth: 0

      - name: Download the inert snapshot candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: living-galaxy-candidate
          path: candidate

      - name: Admit exactly one bounded JSON artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' entries < <(find candidate -mindepth 1 -maxdepth 1 -print0)
          if [[ "${#entries[@]}" -ne 1 || "${entries[0]}" != "candidate/hub-facts.json" ]]; then
            printf 'Candidate artifact has an unexpected path set:\n' >&2
            printf '%s\n' "${entries[@]}" >&2
            exit 1
          fi
          if [[ ! -f candidate/hub-facts.json || -L candidate/hub-facts.json ]]; then
            echo "Candidate must be one regular JSON file." >&2
            exit 1
          fi
          candidate_bytes="$(stat -c %s candidate/hub-facts.json)"
          if (( candidate_bytes < 1024 || candidate_bytes > 524288 )); then
            echo "Candidate size is outside the 1 KiB to 512 KiB publication envelope: $candidate_bytes" >&2
            exit 1
          fi
          candidate_sha="$(sha256sum candidate/hub-facts.json | cut -d' ' -f1)"
          install -m 0644 candidate/hub-facts.json site/hub-assets/hub-facts.json
          test "$candidate_sha" = "$(sha256sum site/hub-assets/hub-facts.json | cut -d' ' -f1)"
          echo "Admitted hub-facts.json sha256=$candidate_sha bytes=$candidate_bytes"

      - name: Refuse every path except the public facts file
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | sed -E 's/^...//' | sort -u)"
          if [[ -n "$changed" && "$changed" != "hub-assets/hub-facts.json" ]]; then
            printf 'Unexpected publication paths:\n%s\n' "$changed" >&2
            exit 1
          fi

      - name: Verify with the trusted current-main test suite
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          node script/hub-facts-custody.mjs --self-test
          node script/check-central-hub.mjs
          node script/check-galaxy-bridge.mjs
          node script/check-galaxy-core.mjs
          node script/check-browser-json-acquisition.mjs
          node script/check-public-pages-artifact.mjs
          node script/check-publisher-races.mjs
          git diff --check

      - name: Publish one exact snapshot commit onto living Pages main
        id: publish
        working-directory: site
        env:
          COMPILER_BASE_SHA: ${{ needs.compile.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_path="$GITHUB_WORKSPACE/candidate/hub-facts.json"
          candidate_sha="$(sha256sum "$candidate_path" | cut -d' ' -f1)"
          observed_sha="$(node script/hub-facts-custody.mjs --file "$candidate_path" --field hiveAi.sourceCommit)"
          bridge_configured="$(node script/hub-facts-custody.mjs --file "$candidate_path" --field refresh.automaticBridgeConfiguredAtCapture)"
          if [[ "$bridge_configured" == "true" ]]; then
            commit_subject="chore(galaxy): absorb Hive-AI ${observed_sha:0:12}"
          else
            commit_subject="chore(galaxy): mark private source bridge inactive"
          fi
          git config user.name "hive-living-main[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cat-file -e "$COMPILER_BASE_SHA^{commit}"

          for attempt in 1 2 3; do
            git fetch origin main
            remote_commit="$(git rev-parse origin/main)"
            decision="$(node script/publisher-candidate-policy.mjs \
              --repository . \
              --base-commit "$COMPILER_BASE_SHA" \
              --remote-commit "$remote_commit" \
              --candidate "$candidate_sha")"
            if [[ "$decision" == "ALREADY_LANDED" ]]; then
              git restore --source=HEAD --staged --worktree hub-assets/hub-facts.json
              git switch --detach origin/main
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "target_sha=$remote_commit" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$decision" != "REBUILD_EXACT" ]]; then
              echo "Publisher transition refused: $decision" >&2
              exit 1
            fi

            git restore --source=HEAD --staged --worktree hub-assets/hub-facts.json
            git switch --detach origin/main
            install -m 0644 "$candidate_path" hub-assets/hub-facts.json
            test "$(sha256sum hub-assets/hub-facts.json | cut -d' ' -f1)" = "$candidate_sha"
            changed_paths="$(git status --porcelain | sed -E 's/^...//' | sort -u)"
            test "$changed_paths" = "hub-assets/hub-facts.json"

            node script/check-central-hub.mjs
            node script/check-galaxy-bridge.mjs
            node script/check-galaxy-core.mjs
            node script/check-browser-json-acquisition.mjs
            node script/check-public-pages-artifact.mjs
            node script/check-publisher-races.mjs
            git diff --check
            git add hub-assets/hub-facts.json
            git commit -m "$commit_subject"
            test "$(git show HEAD:hub-assets/hub-facts.json | sha256sum | cut -d' ' -f1)" = "$candidate_sha"
            test "$(git diff --name-only origin/main...HEAD)" = "hub-assets/hub-facts.json"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Pages main moved through all bounded pushes; a later scheduled run will reconcile again."
          exit 1

  deploy-changed-snapshot:
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-reviewed-pages.yml
    with:
      requested_sha: ${{ needs.publish.outputs.target_sha }}
      signal_kind: sync-direct-handoff
