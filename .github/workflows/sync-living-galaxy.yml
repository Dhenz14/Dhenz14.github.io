name: Sync living galaxy

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: living-galaxy-main-publisher
  cancel-in-progress: false

jobs:
  compile:
    if: github.repository == 'Dhenz14/Dhenz14.github.io' && (github.event_name == 'workflow_dispatch' || vars.LIVING_GALAXY_CLOUD_SYNC_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out trusted Pages compiler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          path: site
          fetch-depth: 1
          persist-credentials: false

      - name: Check private-source credential availability
        id: source-auth
        env:
          HIVE_AI_READ_DEPLOY_KEY: ${{ secrets.HIVE_AI_READ_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${HIVE_AI_READ_DEPLOY_KEY:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "The read-only Hive-AI deploy key is not configured; retaining the last source snapshot behind an inactive bridge boundary."
          fi

      - name: Check out the living Hive-AI source
        id: source-checkout
        if: steps.source-auth.outputs.configured == 'true'
        continue-on-error: true
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Dhenz14/Hive-AI
          ref: main
          path: hive-ai
          ssh-key: ${{ secrets.HIVE_AI_READ_DEPLOY_KEY }}
          ssh-strict: true
          fetch-depth: 128
          filter: blob:none
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /hiveai/__init__.py
            /hiveai/_optional_scripts.py
            /hiveai/living_anatomy/
            /hiveai/static/living-anatomy/src/galaxy-contract.json
            /hiveai/moons/universal_manifest.py
            /hiveai/neuron_swarm/
            /hiveai/one_turn/
            /hiveai/orbs/
            /hiveai/physiology/
            /configs/hivebrain/
            /configs/federation_manifest.json
            /data/neuron_swarm/portable_green_evidence_membership_20260722.json
            /docs/soak_receipts/neuron_swarm/
            /docs/soak_receipts/*.json
            /docs/soak_receipts/*.jsonl
            /docs/FORMAL_CORTEX_LEDGER_V1.json
            /docs/c14_moon_lattice/
            /docs/HIVE_INTEGRITY_DEPENDENCY_GRAPH.json
            /docs/handoffs/
            /docs/UNIFIED_CAPABILITY_REGISTRY.json
            /docs/soak_receipts/proof_carrying_memory_fabric_20260727/
            /docs/soak_receipts/physiology/
            /docs/generated/proof_carrying_memory_galaxy.mmd
            /scripts/build_living_anatomy.py
            /scripts/audit_served_influence_reachability.py
            /scripts/build_neuron_dossiers.py
            /scripts/materialize_full_neuron_swarm.py
            /schemas/living_anatomy_*.schema.json
            /tests/fixtures/physiology/formal_l3_e01_v2/RATIFY_L3_E01_V2.json
            /tests/fixtures/physiology/formal_l3_e02/window_seal/RATIFY_L3_E02_V1.json

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Use Python 3.12
        if: steps.source-auth.outputs.configured == 'true' && steps.source-checkout.outcome == 'success'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/script/requirements-galaxy-sync.txt

      - name: Install the hash-locked compiler dependency
        if: steps.source-auth.outputs.configured == 'true' && steps.source-checkout.outcome == 'success'
        shell: bash
        run: "python -m pip install --require-hashes --only-binary=:all: -r site/script/requirements-galaxy-sync.txt"

      - name: Compile one coherent observation of living main
        if: steps.source-auth.outputs.configured == 'true' && steps.source-checkout.outcome == 'success'
        env:
          GALAXY_AUTOMATIC_BRIDGE: "true"
          GALAXY_BRIDGE_MODE: "cloud"
        shell: bash
        run: |
          set -euo pipefail
          source_repo="$GITHUB_WORKSPACE/hive-ai"
          for attempt in 1 2 3; do
            git -C "$source_repo" fetch --filter=blob:none origin main
            git -C "$source_repo" switch --detach FETCH_HEAD
            if node site/script/sync-galaxy-snapshot.mjs \
              --hive-ai-repo "$source_repo" \
              --hive-ai-ref HEAD; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "Hive-AI main kept moving or stayed unprovable through all bounded attempts; no candidate will be published."
              exit 1
            fi
            if [[ "$attempt" == 1 ]]; then
              git -C "$source_repo" fetch --filter=blob:none --deepen=896 origin main
            elif git -C "$source_repo" rev-parse --is-shallow-repository | grep -qx true; then
              git -C "$source_repo" fetch --filter=blob:none --unshallow origin main
            fi
          done

      - name: Fail closed when the source credential is absent
        if: steps.source-auth.outputs.configured != 'true'
        shell: bash
        run: node site/script/mark-galaxy-bridge-inactive.mjs --credential-missing

      - name: Fail closed when private-source checkout fails
        if: steps.source-auth.outputs.configured == 'true' && steps.source-checkout.outcome != 'success'
        shell: bash
        run: node site/script/mark-galaxy-bridge-inactive.mjs --checkout-failed

      - name: Refuse unexpected compiler changes
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | sed -E 's/^...//' | sort -u)"
          if [[ -z "$changed" ]]; then
            echo "Snapshot already represents the newest coherent observation."
          elif [[ "$changed" != "hub-assets/hub-facts.json" ]]; then
            printf 'Unexpected generated paths:\n%s\n' "$changed" >&2
            exit 1
          fi

      - name: Verify the credential-free candidate
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          node --check hub-assets/hub.js
          node --check hub-assets/galaxy-core.mjs
          node --check script/sync-galaxy-snapshot.mjs
          node --check script/mark-galaxy-bridge-inactive.mjs
          node script/check-central-hub.mjs
          node script/check-galaxy-bridge.mjs
          node script/check-galaxy-core.mjs
          node script/check-http-surface.mjs
          node script/check-publisher-races.mjs
          node script/check-signed-release.mjs
          git diff --check

      - name: Upload only the inert snapshot candidate
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: living-galaxy-candidate
          path: site/hub-assets/hub-facts.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: compile
    if: needs.compile.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out current Pages main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          path: site
          fetch-depth: 0

      - name: Download the inert snapshot candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: living-galaxy-candidate
          path: candidate

      - name: Admit exactly one bounded JSON artifact
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' entries < <(find candidate -mindepth 1 -maxdepth 1 -print0)
          if [[ "${#entries[@]}" -ne 1 || "${entries[0]}" != "candidate/hub-facts.json" ]]; then
            printf 'Candidate artifact has an unexpected path set:\n' >&2
            printf '%s\n' "${entries[@]}" >&2
            exit 1
          fi
          if [[ ! -f candidate/hub-facts.json || -L candidate/hub-facts.json ]]; then
            echo "Candidate must be one regular JSON file." >&2
            exit 1
          fi
          candidate_bytes="$(stat -c %s candidate/hub-facts.json)"
          if (( candidate_bytes < 1024 || candidate_bytes > 524288 )); then
            echo "Candidate size is outside the 1 KiB to 512 KiB publication envelope: $candidate_bytes" >&2
            exit 1
          fi
          candidate_sha="$(sha256sum candidate/hub-facts.json | cut -d' ' -f1)"
          install -m 0644 candidate/hub-facts.json site/hub-assets/hub-facts.json
          installed_sha="$(sha256sum site/hub-assets/hub-facts.json | cut -d' ' -f1)"
          if [[ "$candidate_sha" != "$installed_sha" ]]; then
            echo "Candidate changed while crossing the publisher boundary." >&2
            exit 1
          fi
          echo "Admitted hub-facts.json sha256=$candidate_sha bytes=$candidate_bytes"

      - name: Refuse every path except the public facts file
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | sed -E 's/^...//' | sort -u)"
          if [[ -z "$changed" ]]; then
            echo "Current Pages main already contains this candidate."
          elif [[ "$changed" != "hub-assets/hub-facts.json" ]]; then
            printf 'Unexpected publication paths:\n%s\n' "$changed" >&2
            exit 1
          fi

      - name: Verify with the trusted current-main test suite
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          node --check hub-assets/hub.js
          node --check hub-assets/galaxy-core.mjs
          node --check script/sync-galaxy-snapshot.mjs
          node --check script/mark-galaxy-bridge-inactive.mjs
          node script/check-central-hub.mjs
          node script/check-galaxy-bridge.mjs
          node script/check-galaxy-core.mjs
          node script/check-http-surface.mjs
          node script/check-publisher-races.mjs
          node script/check-signed-release.mjs
          git diff --check

      - name: Publish one exact snapshot commit onto living Pages main
        id: publish
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          candidate_path="$GITHUB_WORKSPACE/candidate/hub-facts.json"
          candidate_sha="$(sha256sum "$candidate_path" | cut -d' ' -f1)"
          base_sha="$(git show HEAD:hub-assets/hub-facts.json | sha256sum | cut -d' ' -f1)"
          observed_sha="$(node -p 'require(process.argv[1]).hiveAi.sourceCommit' "$candidate_path")"
          bridge_enabled="$(node -p 'require(process.argv[1]).refresh.automaticBridgeEnabled' "$candidate_path")"
          if [[ "$bridge_enabled" == "true" ]]; then
            commit_subject="chore(galaxy): absorb Hive-AI ${observed_sha:0:12}"
          else
            commit_subject="chore(galaxy): mark private source bridge inactive"
          fi
          git config user.name "hive-living-main[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            remote_sha="$(git show origin/main:hub-assets/hub-facts.json | sha256sum | cut -d' ' -f1)"
            decision="$(node script/publisher-candidate-policy.mjs \
              --base "$base_sha" --remote "$remote_sha" --candidate "$candidate_sha")"
            if [[ "$decision" == "ALREADY_LANDED" ]]; then
              git restore --source=HEAD --staged --worktree hub-assets/hub-facts.json
              git switch --detach origin/main
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$decision" == "CONCURRENT_FACTS_WINNER" ]]; then
              echo "A concurrent Pages writer changed the facts artifact; preserving that winner for a fresh source compilation." >&2
              exit 1
            fi

            git restore --source=HEAD --staged --worktree hub-assets/hub-facts.json
            git switch --detach origin/main
            install -m 0644 "$candidate_path" hub-assets/hub-facts.json
            installed_sha="$(sha256sum hub-assets/hub-facts.json | cut -d' ' -f1)"
            if [[ "$installed_sha" != "$candidate_sha" ]]; then
              echo "Exact candidate bytes changed during current-main reconstruction." >&2
              exit 1
            fi
            changed_paths="$(git status --porcelain | sed -E 's/^...//' | sort -u)"
            if [[ "$changed_paths" != "hub-assets/hub-facts.json" ]]; then
              printf 'Reconstructed candidate changed an unexpected path:\n%s\n' "$changed_paths" >&2
              exit 1
            fi

            node script/check-central-hub.mjs
            node script/check-galaxy-bridge.mjs
            node script/check-galaxy-core.mjs
            node script/check-http-surface.mjs
            node script/check-publisher-races.mjs
            node script/check-signed-release.mjs
            git diff --check
            git add hub-assets/hub-facts.json
            git commit -m "$commit_subject"
            committed_candidate_sha="$(git show HEAD:hub-assets/hub-facts.json | sha256sum | cut -d' ' -f1)"
            if [[ "$committed_candidate_sha" != "$candidate_sha" ]]; then
              echo "Committed snapshot does not equal the admitted candidate." >&2
              exit 1
            fi
            changed_paths="$(git diff --name-only origin/main...HEAD)"
            if [[ "$changed_paths" != "hub-assets/hub-facts.json" ]]; then
              printf 'Snapshot commit contains unexpected paths:\n%s\n' "$changed_paths" >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Pages main moved through all bounded pushes; the next scheduled run will reconcile again."
          exit 1

      - name: Ensure current Pages main has a build or retry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          landed_sha="$(git -C site rev-parse HEAD)"
          latest_commit=""
          latest_status=""
          if latest_commit="$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.commit // ""')" \
            && latest_status="$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.status // ""')"; then
            echo "Latest Pages build commit=${latest_commit:-missing} status=${latest_status:-missing}"
          else
            echo "Latest Pages build could not be read; requesting a recovery build."
          fi
          if [[ "$latest_commit" != "$landed_sha" \
            || ( "$latest_status" != "built" && "$latest_status" != "building" ) ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          else
            echo "Pages already has a built or building deployment for current main."
          fi
