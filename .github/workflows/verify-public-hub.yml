name: Verify public hub

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Verify JavaScript syntax
        run: |
          node --check hub-assets/hub.js
          node --check hub-assets/galaxy-core.mjs
          node --check script/check-central-hub.mjs
          node --check script/check-ide-release.mjs
          node --check script/check-galaxy-bridge.mjs
          node --check script/check-http-surface.mjs
          node --check script/check-galaxy-core.mjs
          node --check script/check-live-parity.mjs
          node --check script/check-publisher-races.mjs
          node --check script/check-signed-release.mjs
          node --check script/sync-galaxy-snapshot.mjs
          node --check script/mark-galaxy-bridge-inactive.mjs
          node --check script/publisher-candidate-policy.mjs
      - name: Verify public hub contract
        run: |
          node script/check-central-hub.mjs
          node script/check-ide-release.mjs --self-test
          node script/check-galaxy-bridge.mjs
          node script/check-galaxy-core.mjs
          node script/check-http-surface.mjs
          node script/check-publisher-races.mjs
          node script/check-signed-release.mjs
