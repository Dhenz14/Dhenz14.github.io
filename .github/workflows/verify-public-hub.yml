name: Verify public hub

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Default signed-release verification is archive-portable. Full history is
          # retained as an independent provenance check for the same fixture bytes.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Verify JavaScript syntax
        run: |
          node --check hub-assets/hub.js
          node --check hub-assets/galaxy-core.mjs
          node --check hub-assets/ide-release-core.mjs
          node --check hub-assets/strict-json.mjs
          node --check hub-assets/strict-json-fetch.mjs
          node --check script/build-public-pages.mjs
          node --check script/hub-facts-custody.mjs
          node --check script/check-browser-json-acquisition.mjs
          node --check script/check-central-hub.mjs
          node --check script/check-product-truth.mjs
          node --check script/check-ide-release.mjs
          node --check script/check-galaxy-bridge.mjs
          node --check script/check-http-surface.mjs
          node --check script/check-public-pages-artifact.mjs
          node --check script/check-galaxy-core.mjs
          node --check script/check-live-parity.mjs
          node --check script/check-publisher-races.mjs
          node --check script/check-viewport-matrix.mjs
          node --check script/verify-pages-artifact.mjs
          node --check script/check-signed-release.mjs
          node --check script/check-signed-release-portability.mjs
          node --check script/sync-galaxy-snapshot.mjs
          node --check script/mark-galaxy-bridge-inactive.mjs
          node --check script/publisher-candidate-policy.mjs
      - name: Verify Windows smoke PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'script/run-ide-public-windows-smoke.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Verify public hub contract
        run: |
          node script/check-central-hub.mjs
          node script/check-product-truth.mjs --self-test --require-git-binding
          node script/check-ide-release.mjs --self-test
          node script/check-browser-json-acquisition.mjs
          node script/check-galaxy-bridge.mjs
          node script/check-galaxy-core.mjs
          node script/hub-facts-custody.mjs --self-test
          node script/build-public-pages.mjs --self-test --require-link-tests
          node script/verify-pages-artifact.mjs --self-test
          node script/check-public-pages-artifact.mjs
          node script/check-publisher-races.mjs
          node script/check-viewport-matrix.mjs
          node script/check-signed-release.mjs
          node script/check-signed-release.mjs --verify-git-provenance
          node script/check-signed-release.mjs --self-test
          node script/check-signed-release-portability.mjs --git-archive
      - name: Verify exact staged HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/hive-pages-reviewed-pr"
          test ! -e "$stage"
          node script/build-public-pages.mjs build --output "$stage"
          node script/build-public-pages.mjs check --output "$stage"
          node script/check-http-surface.mjs --root "$stage"
